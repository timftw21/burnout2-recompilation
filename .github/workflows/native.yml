name: Native Linux and macOS builds
on:
  push:
    branches: ['**']
    # Release tags always build the downloadable Linux and macOS packages.
    tags: ['v*']
    paths:
      - '.github/workflows/native.yml'
      - 'Build.sh'
      - 'Install.sh'
      - 'Install.command'
      - 'Play.sh'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - 'src/**'
      - 'resources/**'
      - 'knowledge/facts.json'
      - 'knowledge/supported_target.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-game:
    environment: macos-game
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free runner disk space for the Linux build
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      # Bound each expansion below the Actions template and OS argument limits.
      - name: Stage private build inputs 1
        run: |
          mkdir -p data/local
          cat > data/local/ci-inputs.base64 <<'B2_PRIVATE_INPUTS'
          ${{ secrets.B2_CI_INPUTS_00 }}
          ${{ secrets.B2_CI_INPUTS_01 }}
          ${{ secrets.B2_CI_INPUTS_02 }}
          ${{ secrets.B2_CI_INPUTS_03 }}
          ${{ secrets.B2_CI_INPUTS_04 }}
          ${{ secrets.B2_CI_INPUTS_05 }}
          ${{ secrets.B2_CI_INPUTS_06 }}
          ${{ secrets.B2_CI_INPUTS_07 }}
          B2_PRIVATE_INPUTS
      - name: Stage private build inputs 2
        run: |
          cat >> data/local/ci-inputs.base64 <<'B2_PRIVATE_INPUTS'
          ${{ secrets.B2_CI_INPUTS_08 }}
          ${{ secrets.B2_CI_INPUTS_09 }}
          ${{ secrets.B2_CI_INPUTS_10 }}
          ${{ secrets.B2_CI_INPUTS_11 }}
          ${{ secrets.B2_CI_INPUTS_12 }}
          ${{ secrets.B2_CI_INPUTS_13 }}
          ${{ secrets.B2_CI_INPUTS_14 }}
          ${{ secrets.B2_CI_INPUTS_15 }}
          B2_PRIVATE_INPUTS
      - name: Stage private build inputs 3
        run: |
          cat >> data/local/ci-inputs.base64 <<'B2_PRIVATE_INPUTS'
          ${{ secrets.B2_CI_INPUTS_16 }}
          ${{ secrets.B2_CI_INPUTS_17 }}
          ${{ secrets.B2_CI_INPUTS_18 }}
          ${{ secrets.B2_CI_INPUTS_19 }}
          ${{ secrets.B2_CI_INPUTS_20 }}
          ${{ secrets.B2_CI_INPUTS_21 }}
          ${{ secrets.B2_CI_INPUTS_22 }}
          ${{ secrets.B2_CI_INPUTS_23 }}
          B2_PRIVATE_INPUTS
      - name: Stage private build inputs 4
        run: |
          cat >> data/local/ci-inputs.base64 <<'B2_PRIVATE_INPUTS'
          ${{ secrets.B2_CI_INPUTS_24 }}
          ${{ secrets.B2_CI_INPUTS_25 }}
          ${{ secrets.B2_CI_INPUTS_26 }}
          ${{ secrets.B2_CI_INPUTS_27 }}
          ${{ secrets.B2_CI_INPUTS_28 }}
          ${{ secrets.B2_CI_INPUTS_29 }}
          ${{ secrets.B2_CI_INPUTS_30 }}
          ${{ secrets.B2_CI_INPUTS_31 }}
          B2_PRIVATE_INPUTS
      - name: Stage private build inputs 5
        run: |
          cat >> data/local/ci-inputs.base64 <<'B2_PRIVATE_INPUTS'
          ${{ secrets.B2_CI_INPUTS_32 }}
          ${{ secrets.B2_CI_INPUTS_33 }}
          ${{ secrets.B2_CI_INPUTS_34 }}
          ${{ secrets.B2_CI_INPUTS_35 }}
          ${{ secrets.B2_CI_INPUTS_36 }}
          ${{ secrets.B2_CI_INPUTS_37 }}
          ${{ secrets.B2_CI_INPUTS_38 }}
          ${{ secrets.B2_CI_INPUTS_39 }}
          B2_PRIVATE_INPUTS
      - name: Stage private build inputs 6
        run: |
          cat >> data/local/ci-inputs.base64 <<'B2_PRIVATE_INPUTS'
          ${{ secrets.B2_CI_INPUTS_40 }}
          ${{ secrets.B2_CI_INPUTS_41 }}
          ${{ secrets.B2_CI_INPUTS_42 }}
          ${{ secrets.B2_CI_INPUTS_43 }}
          ${{ secrets.B2_CI_INPUTS_44 }}
          ${{ secrets.B2_CI_INPUTS_45 }}
          ${{ secrets.B2_CI_INPUTS_46 }}
          ${{ secrets.B2_CI_INPUTS_47 }}
          B2_PRIVATE_INPUTS
      - name: Stage private build inputs 7
        run: |
          cat >> data/local/ci-inputs.base64 <<'B2_PRIVATE_INPUTS'
          ${{ secrets.B2_CI_INPUTS_48 }}
          ${{ secrets.B2_CI_INPUTS_49 }}
          ${{ secrets.B2_CI_INPUTS_50 }}
          ${{ secrets.B2_CI_INPUTS_51 }}
          ${{ secrets.B2_CI_INPUTS_52 }}
          ${{ secrets.B2_CI_INPUTS_53 }}
          ${{ secrets.B2_CI_INPUTS_54 }}
          ${{ secrets.B2_CI_INPUTS_55 }}
          B2_PRIVATE_INPUTS
      - name: Stage private build inputs 8
        run: |
          cat >> data/local/ci-inputs.base64 <<'B2_PRIVATE_INPUTS'
          ${{ secrets.B2_CI_INPUTS_56 }}
          ${{ secrets.B2_CI_INPUTS_57 }}
          ${{ secrets.B2_CI_INPUTS_58 }}
          B2_PRIVATE_INPUTS
      - name: Restore verified private build inputs
        run: |
          node cmake/ci-game-inputs.mjs restore < data/local/ci-inputs.base64
          rm data/local/ci-inputs.base64
      - name: Install native build dependencies
        run: |
          if [[ $RUNNER_OS == macOS ]]; then bash Install.command --dependencies-only
          else bash Install.sh --dependencies-only && sudo apt-get install -y --no-install-recommends squashfs-tools
          fi
      - name: Build native tooling
        run: bash Build.sh --tools-only
      - name: Report native Metal capabilities
        if: runner.os == 'macOS'
        id: metal
        run: |
          build/macos/Release/b2-tool inspect-metal > build/macos/metal-info.json
          cat build/macos/metal-info.json
          node -e 'const fs=require("fs"), info=JSON.parse(fs.readFileSync("build/macos/metal-info.json","utf8")); fs.appendFileSync(process.env.GITHUB_OUTPUT,`supported=${info.supported}\n`);'
          if ! node -e 'if(!JSON.parse(require("fs").readFileSync("build/macos/metal-info.json","utf8")).supported) process.exit(1)'; then
            echo 'The runner GPU lacks the Apple7/Mac2 family support required by the Metal backend. Full compilation and CPU, audio, effects and file diagnostics still run; GPU diagnostics are unavailable.' | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check native offscreen Metal rendering
        if: steps.metal.outputs.supported == 'true'
        run: |
          node -e "require('fs').writeFileSync('build/macos/ci-color.dat', Buffer.from([0,0,255,255]))"
          if ! build/macos/Release/b2-tool render-texture build/macos/ci-color.dat 6 1 1 build/macos/ci-color.png; then
            xcrun lldb --batch --no-lldbinit --script-language none -o run -k 'thread backtrace --count 32 all' -- \
              build/macos/Release/b2-tool render-texture build/macos/ci-color.dat 6 1 1 build/macos/ci-color-debug.png || true
            exit 1
          fi
      - name: Build full native game
        env:
          # The hosted Linux runner has 16 GB of memory for parallel ThinLTO.
          B2_BUILD_JOBS: ${{ runner.os == 'Linux' && '4' || '' }}
        run: bash Build.sh --game-inputs
      - name: Check native installer application shortcut
        if: runner.os == 'macOS'
        run: |
          bash Install.command --shortcuts-only
          plutil -lint "$HOME/Applications/Burnout 2 Recompilation.app/Contents/Info.plist"
          bash -n "$HOME/Applications/Burnout 2 Recompilation.app/Contents/MacOS/b2"
          PATH=/usr/bin:/bin:/usr/sbin:/sbin "$HOME/Applications/Burnout 2 Recompilation.app/Contents/MacOS/b2" --help
      - name: Check native executables and offline CPU, audio and storage
        run: |
          platform=$([[ $RUNNER_OS == macOS ]] && echo macos || echo linux)
          for executable in b2 b2-tool; do
            file "build/$platform/Release/$executable"
            if [[ $platform == macos ]]; then
              lipo "build/macos/Release/$executable" -verify_arch "$(uname -m)"
              otool -L "build/macos/Release/$executable"
            else ldd "build/linux/Release/$executable"
            fi
          done
          build/$platform/Release/b2-tool --help
          build/$platform/Release/b2 --help
          status=0
          check() {
            printf '\nChecking %s\n' "$1"
            "build/$platform/Release/b2" "$@" || status=1
          }
          check --check-cpu data/local/default.xbe
          check --check-audio
          check --check-effects data/local/b2distfx.bin
          # Storage checks create a D3D11 device; the hosted Linux runner has no
          # Vulkan driver for DXVK, so they run on Linux machines with a GPU.
          if [[ $platform == macos ]]; then check --check-storage data/local/default.xbe build/macos/storage-check; fi
          exit "$status"
      - name: Package the downloadable game
        run: |
          if [[ $RUNNER_OS == macOS ]]; then bash cmake/package-macos.sh build/macos build/release
          else bash cmake/package-linux.sh build/linux build/release
          fi
          ls -l build/release
      # Packages run their own copy of the game from outside the build tree.
      - name: Check the packaged game
        run: |
          if [[ $RUNNER_OS == macOS ]]; then
            mount=$(mktemp -d)
            hdiutil attach -quiet -nobrowse -readonly -mountpoint "$mount" build/release/Burnout2-macOS-*.dmg
            app="$mount/Burnout 2 Recompilation.app"
            codesign --verify --deep --strict "$app"
            plutil -p "$app/Contents/Info.plist"
            otool -L "$app/Contents/MacOS/b2"
            # Inspect only load commands, not otool's header lines naming the mounted files.
            if for file in "$app/Contents/MacOS/b2" "$app"/Contents/Frameworks/*; do otool -L "$file" | tail -n +2; otool -l "$file" | grep -A2 LC_RPATH; done |
              grep -E '(/opt/homebrew|/usr/local|/Users/|/private/)'; then
              echo 'The app still references build-machine libraries.' >&2; exit 1
            fi
            "$app/Contents/MacOS/b2" --check-cpu data/local/default.xbe
            "$app/Contents/MacOS/b2" --check-audio
            hdiutil detach -quiet "$mount"
          else
            game=build/release/Burnout2-x86_64.AppImage
            "$game" --appimage-extract-and-run --check-cpu data/local/default.xbe
            "$game" --appimage-extract-and-run --check-audio
          fi
      - name: Upload release packages
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: burnout2-${{ matrix.runner }}
          path: build/release/
          if-no-files-found: error
          retention-days: 14
      - name: Remove private inputs and generated game output
        if: always()
        run: rm -rf -- data/local build/macos build/linux build/release
