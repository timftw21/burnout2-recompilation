name: Native macOS build
on:
  push:
    paths:
      - '.github/workflows/macos.yml'
      - 'Build.sh'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - 'src/**'
      - 'resources/**'
      - 'knowledge/facts.json'
      - 'knowledge/supported_target.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-game:
    environment: macos-game
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # Use stdin: the complete input exceeds the OS environment/argument limit.
      # Secrets are available only on trusted pushes and manual runs, never forks.
      - name: Restore private build inputs
        run: |
          node cmake/ci-game-inputs.mjs restore <<'B2_PRIVATE_INPUTS'
          ${{ toJSON(secrets) }}
          B2_PRIVATE_INPUTS
      - name: Install native build dependencies
        run: |
          brew install cmake ninja pkgconf openssl@3 libpng jpeg-turbo spirv-headers vulkan-headers vulkan-loader bison flex perl
          if [[ $(uname -m) == arm64 ]]; then brew install mpfr gmp; fi
          export PATH="$(brew --prefix perl)/bin:$PATH"
          PERL_MM_USE_DEFAULT=1 cpan -T JSON
          if ! xcrun --sdk macosx --find metal; then xcodebuild -downloadComponent MetalToolchain; fi
      - name: Build full native game
        run: bash Build.sh --game-inputs
      - name: Check native executables and offline CPU, audio and storage
        run: |
          for executable in b2 b2-tool; do
            file "build/macos/Release/$executable"
            lipo -verify_arch "$(uname -m)" "build/macos/Release/$executable"
            otool -L "build/macos/Release/$executable"
          done
          build/macos/Release/b2-tool --help
          build/macos/Release/b2 --help
          build/macos/Release/b2 --check-cpu data/local/default.xbe
          build/macos/Release/b2 --check-audio
          build/macos/Release/b2 --check-effects data/local/b2distfx.bin
          build/macos/Release/b2 --check-storage data/local/default.xbe build/macos/storage-check
      - name: Remove private inputs and generated game output
        if: always()
        run: rm -rf -- data/local build/macos
