name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-validation:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install pinned dependencies
        run: python -m pip install --requirement requirements-dev.lock

      - name: Run Python and asset-free quality gate
        run: python tools/quality_gate.py

  native-validation:
    runs-on: windows-2025
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        preset:
          - debug
          - release
          - sanitizer
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install pinned native build tools
        run: python -m pip install --requirement requirements-dev.lock

      - name: Configure, build, and test native targets
        run: python tools/native_build.py --preset ${{ matrix.preset }}
