[project]
name = "b2-recomp-tools"
version = "0.1.0"
description = "Offline analysis, recompilation, validation, and runtime tools for b2_recomp"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "capstone==5.0.7",
]

[project.optional-dependencies]
dev = [
    "cmake==4.4.0",
    "mypy==2.3.0",
    "ninja==1.13.0",
    "pre-commit==4.6.1",
    "ruff==0.12.5",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    "build",
    "data/local",
    "reports/local",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tools/**/*.py" = ["E402"]
"tests/**/*.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
follow_imports = "skip"
show_error_codes = true
warn_unreachable = true
files = [
    "tools/compiler_cache.py",
    "tools/dev_check.py",
    "tools/native_build.py",
    "tools/native_toolchain.py",
    "tools/project_identity.py",
    "tools/project_maintenance.py",
    "tools/profiling/system_profile.py",
    "tools/quality_gate.py",
    "tools/python_test_shards.py",
    "tools/playability/differential_replay.py",
    "tools/playability/replay_capsule.py",
    "tools/recomp/debug_metadata.py",
    "tools/recomp/ia32_native_backend.py",
    "tools/recomp/ia32_proof_contract.py",
    "tools/xbe/synthetic_fixture.py",
    "tools/recomp/representative_aot.py",
    "tools/validation_runner.py",
    "tools/playability/live_transport.py",
]
